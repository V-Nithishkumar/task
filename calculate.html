<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
    font-family: fantasy;
    align-items: center;
    background-color:white;
    display:flex ;
    justify-content: center;
}
.calculator{
    width: 300px;
    background-color: rgb(9, 9, 9);
    padding: 30px;
    border-radius: 10px;
    height: 400px;
}
.screen{
    width: 300px;
    background-color: rgb(105, 97, 97);
    border-radius: 40px;
    text-align:right;
    margin-bottom: 10px;
    font-size: 20px;

}
button{
    width: 50px;
    height: 50px;
    background-color: rgb(49, 227, 227);
    border-radius: 50px;
    font-size:20px;
    border-color:black;
}
button:hover{
    background-color: bisque;
}
.calc-buttons{
    display:grid;
    grid-template-columns: repeat(6,1fr);
    row-gap: 15px;
    column-gap: 10px;
}
.operate{
    background-color: rgb(246, 181, 95);
}
.operate:hover{
    background-color: rgb(208, 50, 82);
}
.eq{
    background-color: rgb(136, 221, 10);
}
.eq:hover{
    background-color: red;
}
    </style>
</head>
<body>
    <div class="calculator">
        <h4 style="border:30px;height: 20px; background-color: aliceblue; border-radius: 10px; text-align: center; font-family: arial;">WELCOME TO MY CALCULATOR</h4>
        <input value="0" class="screen" readonly style="text-align: right;">
        <div class="calc-buttons">
            <button type="button">7</button>
            <button type="button">8</button>
            <button type="button">9</button>
            <button type="button" class="operate">DEL</button>
            <button type="button" class="operate">AC</button><br>
            <button type="button">4</button>
            <button type="button">5</button>
            <button type="button">6</button>
            <button type="button" class="operate">x</button>
            <button type="button" class="operate">/</button><br>
            <button type="button">1</button>
            <button type="button">2</button>
            <button type="button">3</button>
            <button type="button" class="operate">+</button>
            <button type="button" class="operate">-</button><br>
            <button type="button">0</button>
            <button type="button">00</button>
            <button type="button">.</button>
            <button type="button" class="operate">%</button>
            <button type="button" class="eq">=</button>
        </div>
    </div>
</body>
</html>
